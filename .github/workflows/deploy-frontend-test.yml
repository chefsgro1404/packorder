name: Deploy Frontend to Test (SWA)

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build kiosk setup exe
        run: |
          dotnet publish tools/kiosk-setup/KioskSetup.csproj \
            -c Release -r win-x64 --self-contained \
            -p:PublishSingleFile=true -p:PublishTrimmed=true \
            -o ./kiosk-build
          mkdir -p client/public/downloads
          cp ./kiosk-build/setup-kiosk-printing.exe client/public/downloads/setup-kiosk-printing.exe

      - name: Deploy to Azure Static Web Apps (Test)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN_TEST }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: client
          output_location: ""
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_VERSION: 20
          NEXT_PUBLIC_APP_NAME: ShipScan
